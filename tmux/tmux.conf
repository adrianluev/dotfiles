# ==============================================================================
# TMUX CONFIG (macOS)
# ==============================================================================

# Use zsh, and run it as a non-login shell so it doesn't re-run path_helper
# and duplicate $PATH entries.
set -g default-shell /bin/zsh
set -g default-command "${SHELL}"

# True color (24-bit) for the zsh prompt and Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"


# ==============================================================================
# PREFIX (Ctrl + Space)
# ==============================================================================

# Default Ctrl+b collides with Neovim's page-up
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# ==============================================================================
# GENERAL
# ==============================================================================

# Short escape delay so <Esc> in Neovim feels instant
set -s escape-time 10

# Mouse: scrolling, pane selection, resizing
set -g mouse on

# Size windows to the largest attached client instead of the smallest
set -g window-size largest

# Pass focus in/out to apps (Neovim uses it to autoread changed files)
set -g focus-events on

# Scrollback history
set -g history-limit 10000


# ==============================================================================
# COPY MODE & SYSTEM CLIPBOARD
# ==============================================================================

# Vi keys in copy mode
setw -g mode-keys vi

# Space would otherwise start a selection / jump; disable it
unbind -T copy-mode-vi Space

# v = start selection, V = select whole line, C-v = rectangle/block toggle
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y / Enter = copy selection to the macOS clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Y = copy as a SINGLE line: every newline (trailing and the ones from a
# wrapped/multi-line command) becomes a space, so pasting never auto-executes.
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "tr '\n' ' ' | pbcopy"

# Mouse drag release copies to the clipboard
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# prefix + P = paste the macOS clipboard (including things copied outside
# tmux, e.g. in a browser), not just tmux's internal buffer.
# Capital P on purpose: lowercase prefix + p stays tmux's "previous window".
bind P run-shell "pbpaste | tmux load-buffer -" \; paste-buffer


# ==============================================================================
# NAVIGATION & SPLITS
# ==============================================================================

# New splits open in the current pane's directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Ctrl+h/j/k/l moves between tmux panes. When the pane runs (n)vim or fzf
# the keys go to that program instead. nvim moves between its splits and,
# at the edge of nvim, calls `tmux select-pane` itself (see init.lua), so
# the same keys cross split and pane boundaries seamlessly.
#
# Trade-off: in plain shell panes these keys no longer reach zsh
# (^L clear-screen, ^K kill-line, ^H backspace, ^J enter). Use
# prefix + Ctrl-l to clear the screen (bound below).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|[ln]?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# prefix + Ctrl-l = send a real Ctrl-l (clear screen) to the pane
bind C-l send-keys C-l

# prefix + r reloads this file
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
