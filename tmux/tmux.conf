# --- Prefix: Ctrl+Space ---
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# --- Shell defaults ---
set -g default-shell /bin/zsh
set -g default-command "$SHELL"

# --- Vi-mode copy ---
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y and Enter finish the selection and pipe it straight to the macOS
# system clipboard instead of just tmux's internal paste buffer.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# prefix + p pulls whatever is on the system clipboard into tmux's buffer
# before pasting, so pasting picks up things copied outside tmux too
# (e.g. from a browser), not just tmux-internal copies.
bind-key p run-shell "pbpaste | tmux load-buffer -" \; paste-buffer

set -g mouse on

# --- Integration niceties ---
# Low escape-time so nvim's <Esc> doesn't feel laggy inside tmux (nvim
# waits this long to decide a lone Esc isn't the start of an escape
# sequence tmux is relaying).
set -sg escape-time 10

# Let nvim see focus-in/out events (used for autoread below).
set -g focus-events on

# Terminal.app has partial 24-bit color support; this asks tmux to pass
# true color through. If colors look off, this is the line to revisit.
set -ga terminal-overrides ",xterm-256color:Tc"

# Seamless C-h/j/k/l pane navigation shared between tmux panes and nvim
# splits: inside nvim the keys go to nvim's own window movement, outside
# nvim they move tmux panes. Requires matching keymaps in nvim (see init.lua).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# prefix + r reloads this file without restarting the session.
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
